name: Generate Immutable Successor Vectors Once

on:
  pull_request:
    paths:
      - ".github/workflows/generate-immutable-successor-vectors-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Generate and validate append and multi-level vectors
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          import experiment_exp0002_immutable_page_objects as objects

          directory = Path("tests/vectors/exp-0002-immutable")
          base = bytes.fromhex((directory / "genesis-four.hex").read_text(encoding="ascii"))
          base_report = objects.validate_complete(base)
          assert base_report.structural.sequence == 0

          append = objects.append_replacement(
              base,
              objects.ObjectInput(1, 9, b"alpha-v2"),
          )
          append_report = objects.validate_complete(append)
          assert append_report.structural.sequence == 1
          assert append_report.object_payloads[1] == b"alpha-v2"
          assert append_report.object_payloads[2] == b"bravo"

          values = [
              objects.ObjectInput(
                  object_id,
                  1 + object_id % 5,
                  f"payload:{object_id}".encode("ascii"),
              )
              for object_id in range(1, 401)
          ]
          multi = objects.build_genesis(values)
          multi_report = objects.validate_complete(multi)
          assert multi_report.structural.sequence == 0
          assert multi_report.structural.root.level == 1
          assert len(multi_report.structural.reachable_pages) == 4
          assert len(multi_report.objects) == 400

          vectors = [
              (
                  "genesis-four.hex",
                  base,
                  base_report,
                  [1, 2, 3, 4],
                  ["alpha", "bravo", "charlie", "delta"],
                  "exact-end immutable-page genesis independently parsed and hashed by Rust",
              ),
              (
                  "append-replace-one.hex",
                  append,
                  append_report,
                  [1, 2, 3, 4],
                  ["alpha-v2", "bravo", "charlie", "delta"],
                  "parent-linked append replacing object one while reusing historical objects",
              ),
              (
                  "multi-level-400.hex",
                  multi,
                  multi_report,
                  [1, 400],
                  ["payload:1", "payload:400"],
                  "four-page height-one tree with 400 complete objects",
              ),
          ]

          entries = []
          for filename, data, report, object_ids, payloads, purpose in vectors:
              encoded = data.hex()
              (directory / filename).write_text(
                  "\n".join(
                      encoded[index:index + 128]
                      for index in range(0, len(encoded), 128)
                  )
                  + "\n",
                  encoding="ascii",
              )
              entries.append(
                  {
                      "file": filename,
                      "decoded_bytes": len(data),
                      "sha256": sha256(data).hexdigest(),
                      "sequence": report.structural.sequence,
                      "root_level": report.structural.root.level,
                      "page_count": len(report.structural.reachable_pages),
                      "object_count": len(report.objects),
                      "representative_object_ids": object_ids,
                      "representative_payloads_utf8": payloads,
                      "purpose": purpose,
                  }
              )
              assert data[-128:-120] == b"UCFTIM02"
              print(filename, len(data), sha256(data).hexdigest())

          manifest = {
              "status": "non-normative successor microformat evidence",
              "epoch": "immutable-page-successor-prototype",
              "vectors": entries,
          }
          (directory / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit generated vectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vectors/exp-0002-immutable
          git diff --cached --check
          git commit -m "test: pin immutable successor append and multi-level vectors"
          git push origin HEAD:phase-3/directory-snapshots-recovery
