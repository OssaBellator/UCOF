name: Patch Phase 3 Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          directory_path = Path("crates/ucof-experiments/src/directory.rs")
          lines = directory_path.read_text(encoding="utf-8").splitlines()
          assignment = '        children[0].range = directory.pages[root].range().expect("root range");'
          if assignment in lines:
              assignment_index = lines.index(assignment)
              borrow_index = next(
                  index for index in range(assignment_index - 8, assignment_index)
                  if 'let Page::Internal { children, .. } = &mut directory.pages[root]' in lines[index]
              )
              lines.insert(borrow_index, '        let root_range = directory.pages[root].range().expect("root range");')
              assignment_index += 1
              lines[assignment_index] = '        children[0].range = root_range;'
              directory_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          elif '        children[0].range = root_range;' not in lines:
              raise SystemExit("borrow patch anchor not found")

          enumeration_path = Path("crates/ucof-experiments/src/enumeration.rs")
          enumeration = enumeration_path.read_text(encoding="utf-8")
          enumeration = enumeration.replace(
              "fn candidate_and_result_limits_apply_before enumeration_growth()",
              "fn candidate_and_result_limits_apply_before_enumeration_growth()",
              1,
          )
          enumeration_path.write_text(enumeration, encoding="utf-8")

          fuzz_path = Path(".github/workflows/fuzz.yml")
          fuzz = fuzz_path.read_text(encoding="utf-8")
          if "            root_enumeration \\\n" not in fuzz:
              fuzz = fuzz.replace(
                  "            snapshot_selection \\\n            recovery_scan \\\n",
                  "            snapshot_selection \\\n            root_enumeration \\\n            publication_model \\\n            recovery_scan \\\n",
                  1,
              )
          fuzz_path.write_text(fuzz, encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments fuzz .github/workflows/fuzz.yml
          git commit -m "test: correct and register Phase 3 research coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
