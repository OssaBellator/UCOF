name: Patch Phase 3 Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          directory_path = Path("crates/ucof-experiments/src/directory.rs")
          directory = directory_path.read_text(encoding="utf-8")
          old = '''        let root = directory.root;
          let Page::Internal { children, .. } = &mut directory.pages[root] else {
              panic!("expected internal root");
          };
          children[0].page_id = root;
          children[0].range = directory.pages[root].range().expect("root range");'''
          new = '''        let root = directory.root;
          let root_range = directory.pages[root].range().expect("root range");
          let Page::Internal { children, .. } = &mut directory.pages[root] else {
              panic!("expected internal root");
          };
          children[0].page_id = root;
          children[0].range = root_range;'''
          if old in directory:
              directory_path.write_text(directory.replace(old, new, 1), encoding="utf-8")
          elif "children[0].range = root_range;" not in directory:
              raise SystemExit("borrow patch anchor not found")

          enumeration_path = Path("crates/ucof-experiments/src/enumeration.rs")
          enumeration = enumeration_path.read_text(encoding="utf-8")
          enumeration = enumeration.replace(
              "fn candidate_and_result_limits_apply_before enumeration_growth()",
              "fn candidate_and_result_limits_apply_before_enumeration_growth()",
              1,
          )
          enumeration_path.write_text(enumeration, encoding="utf-8")
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments
          git commit -m "test: correct Phase 3 research model tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
