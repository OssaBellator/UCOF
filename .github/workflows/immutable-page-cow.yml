name: Immutable Page COW Prototype

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "docs/experiments/0015-exp0002-immutable-page-cow.md"
      - ".github/workflows/immutable-page-cow.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "docs/experiments/0015-exp0002-immutable-page-cow.md"
      - ".github/workflows/immutable-page-cow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise immutable-page copy-on-write bytes
        run: python3 tools/experiment_exp0002_immutable_page_cow.py
