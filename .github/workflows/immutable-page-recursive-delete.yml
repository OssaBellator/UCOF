name: Immutable Page Recursive Delete

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_recursive_delete.py"
      - "docs/experiments/0027-exp0002-immutable-page-recursive-delete.md"
      - ".github/workflows/immutable-page-recursive-delete.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_recursive_delete.py"
      - "docs/experiments/0027-exp0002-immutable-page-recursive-delete.md"
      - ".github/workflows/immutable-page-recursive-delete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise recursive immutable deletion and root collapse
        run: python3 tools/experiment_exp0002_immutable_page_recursive_delete.py
