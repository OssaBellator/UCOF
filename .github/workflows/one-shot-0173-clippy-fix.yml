name: One-shot 0173 Clippy fix

on:
  push:
    branches:
      - phase-3/encrypted-operation-restart-classification

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix encrypted restart Clippy findings'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/encrypted-operation-restart-classification
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch Clippy findings
        shell: python
        run: |
          from pathlib import Path
          impl = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart.rs')
          text = impl.read_text()
          text = text.replace(
              'let mut entries = std::fs::read_dir(linux_nonce_procfd_directory(stage_directory))',
              'let entries = std::fs::read_dir(linux_nonce_procfd_directory(stage_directory))',
          )
          text = text.replace('while let Some(entry) = entries.next() {', 'for entry in entries {', 1)
          impl.write_text(text)

          tests = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart_tests.rs')
          text = tests.read_text()
          text = text.replace('    drop(session);\n', '', 1)
          tests.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart.rs crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart_tests.rs
          git commit -m 'Fix encrypted restart Clippy findings'
          git push origin HEAD:phase-3/encrypted-operation-restart-classification
