name: Materialize MSRV-Compatible Conditional Reqwest Lock

on:
  push:
    branches: ["phase-3/conditional-reqwest-http"]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/conditional-reqwest-http
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Generate MSRV-compatible lockfile
        run: cargo generate-lockfile
      - name: Verify HTTP feature at MSRV before commit
        run: cargo check --locked -p ucof-experiments --all-targets --features http-reqwest
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "Resolve optional HTTP dependencies for Rust 1.85"
          git push origin HEAD:phase-3/conditional-reqwest-http
