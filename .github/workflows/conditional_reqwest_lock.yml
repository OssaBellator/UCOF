name: Materialize Conditional Reqwest Lock

on:
  push:
    branches: ["phase-3/conditional-reqwest-http"]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/conditional-reqwest-http
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "Lock optional conditional HTTP dependencies"
          git push origin HEAD:phase-3/conditional-reqwest-http
