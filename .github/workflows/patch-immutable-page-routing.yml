name: Patch Immutable Page Routing

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/patch-immutable-page-routing.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Define canonical gap routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/experiment_exp0002_immutable_page_splits.py")
          text = path.read_text(encoding="utf-8")
          old = '''    child_index = next(
              (index for index, child in enumerate(children) if child.minimum <= value.object_id <= child.maximum),
              None,
          )
          if child_index is None:
              if value.object_id < children[0].minimum:
                  child_index = 0
              elif value.object_id > children[-1].maximum:
                  child_index = len(children) - 1
              else:
                  raise ValueError("insertion falls into an unowned child gap")
          '''.replace("          ", "    ")
          new = '''    child_index = next(
              (index for index, child in enumerate(children) if value.object_id <= child.maximum),
              len(children) - 1,
          )
          '''.replace("          ", "    ")
          if text.count(old) != 1:
              raise SystemExit(f"routing anchor count was {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Execute focused and sequence prototypes
        run: |
          python3 tools/experiment_exp0002_immutable_page_splits.py
          python3 tools/experiment_exp0002_immutable_page_sequences.py
      - name: Commit tested routing rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/experiment_exp0002_immutable_page_splits.py
          git diff --cached --check
          git commit -m "fix: define canonical immutable-page gap routing"
          git push origin HEAD:phase-3/directory-snapshots-recovery
