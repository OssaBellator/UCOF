name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/ucof-core/**"
      - "crates/ucof-experiments/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Compile fuzz targets
        run: cargo fuzz build
      - name: Smoke fuzz targets
        run: |
          for target in \
            full_file \
            canonical_metadata \
            metadata_inspect \
            prefix_salvage \
            sequential_reader \
            writer_roundtrip \
            paged_directory \
            snapshot_selection \
            root_enumeration \
            publication_model \
            recovery_scan \
            compaction_plan \
            repair_plan \
            exp0002_strict \
            exp0002_recovery \
            exp0002_roundtrip \
            exp0002_lookup \
            exp0002_rewrite \
            exp0002_source_lookup \
            exp0002_source_strict_recovery \
            exp0002_source_history \
            immutable_successor_strict \
            immutable_successor_roundtrip \
            immutable_successor_history_recovery \
            immutable_successor_rewrite \
            immutable_successor_source_lookup \
            immutable_successor_source_history_recovery \
            immutable_successor_persistent_source_copy \
            immutable_successor_persistent_versioned_source_copy
          do
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              cargo fuzz run "$target" -- -max_total_time=30 -max_len=65536
            else
              cargo fuzz run "$target" -- -runs=256 -max_len=65536
            fi
          done
