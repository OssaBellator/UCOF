name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/ucof-core/**"
      - "crates/ucof-experiments/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Compile fuzz targets
        run: cargo fuzz build
      - name: Smoke fuzz targets
        run: |
          mkdir -p fuzz-smoke-logs
          cargo fuzz list | tee fuzz-smoke-logs/targets.txt

          while IFS= read -r target; do
            [[ -z "$target" ]] && continue
            log="fuzz-smoke-logs/${target}.log"
            echo "$target" > fuzz-smoke-logs/current-target.txt
            echo "::group::Smoke fuzz target: $target"

            set +e
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              cargo fuzz run "$target" -- -max_total_time=30 -max_len=65536 2>&1 | tee "$log"
            else
              cargo fuzz run "$target" -- -runs=256 -max_len=65536 2>&1 | tee "$log"
            fi
            status=${PIPESTATUS[0]}
            set -e

            echo "::endgroup::"
            if [[ $status -ne 0 ]]; then
              echo "$target" > fuzz-smoke-logs/failing-target.txt
              printf '## Fuzz smoke failure\n\n- Target: `%s`\n- Exit status: `%s`\n- Log artifact: `fuzz-smoke-diagnostics`\n' \
                "$target" "$status" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Fuzz smoke failure::Target $target exited with status $status"
              exit "$status"
            fi
          done < fuzz-smoke-logs/targets.txt

          rm -f fuzz-smoke-logs/current-target.txt
          printf '## Fuzz smoke result\n\nAll listed targets passed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fuzz smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-diagnostics
          path: |
            fuzz-smoke-logs/
            fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 7
