name: Normalize EXP-0002 Lookup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce selected-record physical isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-experiments/src/exp0002_lookup.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "    let snapshot_bytes = &bytes[snapshot_range];",
                  "    let snapshot_bytes = &bytes[snapshot_range.clone()];",
              ),
              (
                  "    let mut pages_read = 0_usize;\n    loop {",
                  "    let mut pages_read = 0_usize;\n    let mut authenticated_page_ranges = Vec::new();\n    loop {",
              ),
              (
                  "        let page_range = checked_range(expected.offset, PAGE_SIZE as u64, bytes.len())?;\n        let page = &bytes[page_range];",
                  "        let page_range = checked_range(expected.offset, PAGE_SIZE as u64, bytes.len())?;\n        authenticated_page_ranges.push(page_range.clone());\n        let page = &bytes[page_range];",
              ),
              (
                  "                let record = &bytes[record_range];",
                  "                if authenticated_page_ranges\n                    .iter()\n                    .any(|page_range| ranges_overlap(&record_range, page_range))\n                    || ranges_overlap(&record_range, &snapshot_range)\n                    || ranges_overlap(&record_range, &(footer_offset..bytes.len()))\n                {\n                    return Err(Exp0002Error::PhysicalOverlap);\n                }\n                let record = &bytes[record_range];",
              ),
              (
                  "fn check_hashed(\n",
                  "fn ranges_overlap(\n    left: &std::ops::Range<usize>,\n    right: &std::ops::Range<usize>,\n) -> bool {\n    left.start < right.end && right.start < left.end\n}\n\nfn check_hashed(\n",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"lookup patch anchor not found: {old[:60]}")
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
      - name: Commit normalized lookup sources
        run: |
          if [[ -z "$(git status --porcelain -- crates/ucof-experiments fuzz)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments fuzz
          git commit -m "fix: isolate authenticated lookup record ranges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
