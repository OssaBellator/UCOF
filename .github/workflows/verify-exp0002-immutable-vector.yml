name: Verify Immutable Successor Vector

on:
  pull_request:
    paths:
      - "tests/vectors/exp-0002-immutable/**"
      - "crates/ucof-experiments/src/immutable_successor.rs"
      - "crates/ucof-experiments/src/lib.rs"
      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - "crates/ucof-experiments/tests/immutable_successor_history.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_vector.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_generated_vectors.rs"
      - "tools/prepare_immutable_successor_history.py"
      - ".github/workflows/verify-exp0002-immutable-vector.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tests/vectors/exp-0002-immutable/**"
      - "crates/ucof-experiments/src/immutable_successor.rs"
      - "crates/ucof-experiments/src/lib.rs"
      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - "crates/ucof-experiments/tests/immutable_successor_history.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_vector.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_generated_vectors.rs"
      - "tools/prepare_immutable_successor_history.py"
      - ".github/workflows/verify-exp0002-immutable-vector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned vector manifest and boundaries
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          directory = Path("tests/vectors/exp-0002-immutable")
          manifest = json.loads((directory / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["status"] == "non-normative successor microformat evidence"
          assert len(manifest["vectors"]) == 1
          vector = manifest["vectors"][0]
          data = bytes.fromhex((directory / vector["file"]).read_text(encoding="ascii"))
          digest = sha256(data).hexdigest()
          assert len(data) == vector["decoded_bytes"]
          assert digest == vector["sha256"]
          magic = b"UCFTIM02"
          offsets = []
          cursor = 0
          while True:
              offset = data.find(magic, cursor)
              if offset < 0:
                  break
              offsets.append(offset)
              cursor = offset + 1
          assert offsets == [len(data) - 128]
          print(f"decoded_bytes={len(data)}")
          print(f"sha256={digest}")
          print(f"footer_magic_offsets={offsets}")
          print("trailing_bytes_after_last_footer=0")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply bounded history and recovery increment
        run: |
          python3 tools/prepare_immutable_successor_history.py
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Export normalized history and recovery increment
        uses: actions/upload-artifact@v4
        with:
          name: formatted-immutable-successor-history
          path: |
            crates/ucof-experiments/src/immutable_successor.rs
            crates/ucof-experiments/src/lib.rs
            crates/ucof-experiments/tests/immutable_successor_api.rs
            crates/ucof-experiments/tests/immutable_successor_history.rs
          if-no-files-found: error
      - name: Lint successor parser and reusable APIs
        run: cargo clippy --locked -p ucof-experiments --test exp0002_immutable_vector --test immutable_successor_api --test immutable_successor_history --test exp0002_immutable_generated_vectors -- -D warnings
      - name: Parse, generate, validate, traverse history, and recover prefixes
        run: |
          cargo test --locked -p ucof-experiments --test exp0002_immutable_vector -- --nocapture
          cargo test --locked -p ucof-experiments --test immutable_successor_api -- --nocapture
          cargo test --locked -p ucof-experiments --test immutable_successor_history -- --nocapture
          cargo test --locked -p ucof-experiments --test exp0002_immutable_generated_vectors -- --nocapture
