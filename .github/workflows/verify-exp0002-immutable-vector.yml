      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_vector.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_generated_vectors.rs"
      - ".github/workflows/verify-exp0002-immutable-vector.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tests/vectors/exp-0002-immutable/**"
      - "crates/ucof-experiments/src/immutable_successor.rs"
      - "crates/ucof-experiments/src/lib.rs"
      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_vector.rs"
      - "crates/ucof-experiments/tests/exp0002_immutable_generated_vectors.rs"
      - ".github/workflows/verify-exp0002-immutable-vector.yml"
