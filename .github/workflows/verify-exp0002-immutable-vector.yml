name: Verify Immutable Successor Vector

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - "crates/ucof-experiments/src/immutable_successor.rs"
      - "crates/ucof-experiments/src/lib.rs"
      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - "tools/prepare_immutable_successor_source.py"
      - ".github/workflows/verify-exp0002-immutable-vector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize and verify reusable immutable successor API
        run: |
          python3 tools/prepare_immutable_successor_source.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked -p ucof-experiments --test exp0002_immutable_vector --test immutable_successor_api -- -D warnings
          cargo test --locked -p ucof-experiments --test exp0002_immutable_vector
          cargo test --locked -p ucof-experiments --test immutable_successor_api
          cargo test --locked -p ucof-experiments --test exp0002_immutable_generated_vectors
      - name: Commit normalized source and restore read-only verifier
        run: |
          rm -f tools/prepare_immutable_successor_source.py
          rm -f .github/workflows/export-formatted-immutable-successor.yml
          python3 - <<'PY'
          from pathlib import Path

          Path('.github/workflows/verify-exp0002-immutable-vector.yml').write_text('''name: Verify Immutable Successor Vector

