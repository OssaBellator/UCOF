name: One-shot 0172 compile fix

on:
  push:
    branches:
      - phase-3/durable-nonce-journal-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix durable nonce journal compile seams'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/durable-nonce-journal-integration
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch compile seams
        shell: python
        run: |
          from pathlib import Path

          impl = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_durable_nonce_journal.rs')
          text = impl.read_text()
          text = text.replace(
              '|| !nonce_at_least(floor.next_unreserved, durable.next_unreserved)',
              '|| !linux_nonce_at_least(floor.next_unreserved, durable.next_unreserved)',
          )
          anchor = 'fn linux_nonce_key_id(aes_key: &[u8; 32]) -> [u8; 16] {'
          helper = '''fn linux_nonce_at_least(previous: Option<u64>, next: Option<u64>) -> bool {
              match (previous, next) {
                  (None, None) => true,
                  (None, Some(_)) => false,
                  (Some(_), None) => true,
                  (Some(previous), Some(next)) => next >= previous,
              }
          }

          '''
          if 'fn linux_nonce_at_least(' not in text:
              if anchor not in text:
                  raise SystemExit('0172 key-id anchor missing')
              text = text.replace(anchor, helper + anchor)
          impl.write_text(text)

          tests = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_durable_nonce_journal_tests.rs')
          text = tests.read_text()
          text = text.replace('fn journal(', 'fn open_journal(', 1)
          text = text.replace('journal(&directory.0,', 'open_journal(&directory.0,')
          tests.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_durable_nonce_journal.rs crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_durable_nonce_journal_tests.rs
          git commit -m 'Fix durable nonce journal compile seams'
          git push origin HEAD:phase-3/durable-nonce-journal-integration
