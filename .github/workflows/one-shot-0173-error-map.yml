name: One-shot 0173 error mapping

on:
  push:
    branches:
      - phase-3/encrypted-operation-restart-classification

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Map encrypted restart UID errors'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/encrypted-operation-restart-classification
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Map UID errors
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart.rs')
          text = path.read_text()
          old = 'metadata.uid() != linux_nonce_effective_uid()?'
          new = '''metadata.uid()
                  != linux_nonce_effective_uid()
                      .map_err(|error| LinuxEncryptedStageRestartError::Journal(error.to_string()))?'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 UID conversion sites, found {count}')
          path.write_text(text.replace(old, new))
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/linux_encrypted_stage_restart.rs
          git commit -m 'Map encrypted restart UID errors'
          git push origin HEAD:phase-3/encrypted-operation-restart-classification
