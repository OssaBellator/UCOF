name: Patch EXP-0002 Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove unused import and normalize sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-experiments/src/exp0002.rs")
          text = path.read_text(encoding="utf-8")
          old = "use std::collections::{BTreeMap, BTreeSet};"
          new = "use std::collections::BTreeSet;"
          if old not in text and new not in text:
              raise SystemExit("collection import anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
      - name: Commit source patch
        run: |
          if [[ -z "$(git status --porcelain -- crates/ucof-experiments/src fuzz)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src fuzz
          git commit -m "fix: normalize EXP-0002 lint and fuzz bounds"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
