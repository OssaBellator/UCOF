name: Apply Async Full Test Compile Fix

on:
  push:
    branches: ["phase-3/conditional-async-full-validation"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/conditional-async-full-validation
      - name: Patch test-only Send scope and unused imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ucof-experiments/src/immutable_successor/conditional_async_source_full.rs')
          text = path.read_text()
          text = text.replace('use std::future::Future;\nuse std::pin::Pin;\n\n', '', 1)
          old = '''                    let mut counts = observed.lock().expect("counts");
                    counts.ranges += 1;
                    let range_number = counts.ranges;
                    drop(counts);
'''
          new = '''                    let range_number = {
                        let mut counts = observed.lock().expect("counts");
                        counts.ranges += 1;
                        counts.ranges
                    };
'''
          if old not in text:
              raise SystemExit('expected range-count block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Verify HTTP feature compiles at MSRV
        run: cargo check --locked -p ucof-experiments --all-targets --features http-reqwest
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ucof-experiments/src/immutable_successor/conditional_async_source_full.rs
          git commit -m "Fix async full validation test Send scope"
          git push origin HEAD:phase-3/conditional-async-full-validation
