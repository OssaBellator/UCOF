name: Land Immutable Successor History

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/land-immutable-successor-history.yml"

permissions:
  actions: read
  contents: write

jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download verified history artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/formatted
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/8756429781/zip > /tmp/formatted.zip
          unzip -q /tmp/formatted.zip -d /tmp/formatted
          cp /tmp/formatted/src/immutable_successor.rs crates/ucof-experiments/src/immutable_successor.rs
          cp /tmp/formatted/tests/immutable_successor_history.rs crates/ucof-experiments/tests/immutable_successor_history.rs
          test "$(git hash-object crates/ucof-experiments/src/immutable_successor.rs)" = "551cefbb373d7a28fd29856cf52dc291911a516c"
          test "$(git hash-object crates/ucof-experiments/tests/immutable_successor_history.rs)" = "b294b36f01827c27e0244584c069423b1f76b3c8"
      - name: Verify checked-in result
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p ucof-experiments --test exp0002_immutable_vector --test immutable_successor_api --test immutable_successor_history --test exp0002_immutable_generated_vectors -- -D warnings
          cargo test --locked -p ucof-experiments --test exp0002_immutable_vector
          cargo test --locked -p ucof-experiments --test immutable_successor_api
          cargo test --locked -p ucof-experiments --test immutable_successor_history
          cargo test --locked -p ucof-experiments --test exp0002_immutable_generated_vectors
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src/immutable_successor.rs \
            crates/ucof-experiments/tests/immutable_successor_history.rs
          git diff --cached --check
          git commit -m "feat: add bounded successor history and recovery"
          git push origin HEAD:phase-3/directory-snapshots-recovery
