name: Patch EXP-0002 Source Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add source emptiness contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-experiments/src/exp0002_source.rs")
          text = path.read_text(encoding="utf-8")
          old = '''pub trait Exp0002ReadAt {
              fn len(&mut self) -> io::Result<u64>;
              fn read_exact_at(&mut self, offset: u64, buffer: &mut [u8]) -> io::Result<()>;
          }'''
          new = '''pub trait Exp0002ReadAt {
              fn len(&mut self) -> io::Result<u64>;

              fn is_empty(&mut self) -> io::Result<bool> {
                  Ok(self.len()? == 0)
              }

              fn read_exact_at(&mut self, offset: u64, buffer: &mut [u8]) -> io::Result<()>;
          }'''
          if old not in text and new not in text:
              raise SystemExit("source trait anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
      - name: Commit lint patch
        run: |
          if git diff --quiet -- crates/ucof-experiments/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src
          git commit -m "fix: define EXP-0002 source emptiness contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
