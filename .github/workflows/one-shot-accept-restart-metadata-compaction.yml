name: One-shot accept restart metadata compaction

on:
  push:
    branches:
      - phase-3/restart-metadata-compaction
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  accept-current-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/restart-metadata-compaction
          fetch-depth: 0

      - name: Require stable head and green repository workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "Rust"
            "Fuzz"
            "Phase 3 Evidence"
            "Verify Phase 3 Integration"
          )

          ready=0
          for _ in $(seq 1 120); do
            current_sha="$(gh api "repos/${REPO}/branches/phase-3/restart-metadata-compaction" --jq '.commit.sha')"
            if [[ "${current_sha}" != "${CANDIDATE_SHA}" ]]; then
              echo "Branch advanced to ${current_sha}; this acceptance run is obsolete."
              exit 0
            fi

            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${CANDIDATE_SHA}&per_page=100")"

            failure_count="$(jq --arg run_id "${RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $run_id) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")] | length' <<<"${runs}")"
            if [[ "${failure_count}" != "0" ]]; then
              echo "At least one repository workflow failed on ${CANDIDATE_SHA}."
              jq --arg run_id "${RUN_ID}" -r '.workflow_runs[] | select((.id|tostring) != $run_id) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | "\(.name): \(.conclusion)"' <<<"${runs}"
              exit 1
            fi

            missing=0
            for name in "${required[@]}"; do
              conclusion="$(jq -r --arg name "${name}" '[.workflow_runs[] | select(.name == $name)] | sort_by(.run_number) | last | .conclusion // "missing"' <<<"${runs}")"
              if [[ "${conclusion}" != "success" ]]; then
                missing=1
                break
              fi
            done

            pending_count="$(jq --arg run_id "${RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $run_id) | select(.status != "completed")] | length' <<<"${runs}")"
            if [[ "${missing}" == "0" && "${pending_count}" == "0" ]]; then
              ready=1
              break
            fi
            sleep 15
          done

          if [[ "${ready}" != "1" ]]; then
            echo "Required repository workflows did not converge to green on the stable candidate head."
            exit 1
          fi

      - name: Promote accepted Experiment 0179 evidence and retire coordinator
        env:
          ACCEPTED_SHA: ${{ github.sha }}
          ACCEPTANCE_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/experiments/0179-restart-metadata-compaction.md")
          text = path.read_text()
          text = text.replace(
              "**Status:** pending non-normative Phase 3 implementation evidence  ",
              "**Status:** accepted non-normative Phase 3 implementation evidence  ",
              1,
          )
          old = """## Verification\n\nPending. This document must not be promoted to accepted evidence until a pinned implementation head passes the repository Rust/portability/integration gates.\n"""
          new = f"""## Verification\n\nAccepted implementation head:\n\n`{os.environ['ACCEPTED_SHA']}`\n\nAcceptance coordinator workflow run:\n\n`{os.environ['ACCEPTANCE_RUN']}`\n\nThe self-retiring acceptance coordinator required the current branch head to remain stable and required the repository Rust, Fuzz, Phase 3 Evidence, and Verify Phase 3 Integration workflows, plus every other concurrently triggered branch workflow visible on that head, to complete without failure before this status was promoted.\n"""
          if old not in text:
              raise SystemExit("pending Experiment 0179 verification block not found")
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/one-shot-accept-restart-metadata-compaction.yml
          rm -f .github/workflows/one-shot-format-restart-metadata-compaction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Accept restart metadata compaction experiment'
          git push origin HEAD:phase-3/restart-metadata-compaction
