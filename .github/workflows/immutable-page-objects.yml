name: Immutable Page Objects

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_objects.py"
      - "docs/experiments/0031-exp0002-immutable-page-objects.md"
      - ".github/workflows/immutable-page-objects.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_objects.py"
      - "docs/experiments/0031-exp0002-immutable-page-objects.md"
      - ".github/workflows/immutable-page-objects.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise complete objects with immutable pages
        run: python3 tools/experiment_exp0002_immutable_page_objects.py
