name: Integrate EXP-0002 Vectors

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize and generate vectors
        run: |
          cargo fmt --all
          python3 tools/exp0002_codec.py --self-test
          rm -rf tests/vectors/exp-0002
          python3 tools/exp0002_codec.py --write-vectors tests/vectors/exp-0002
          python3 tools/exp0002_codec.py --verify-vectors tests/vectors/exp-0002
      - name: Commit generated state
        run: |
          if [[ -z "$(git status --porcelain -- crates/ucof-experiments/src tests/vectors/exp-0002)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src tests/vectors/exp-0002
          git commit -m "test: add deterministic EXP-0002 vectors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
