name: Normalize EXP-0002 Rewrite

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize rewrite sources
        run: |
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
      - name: Commit normalized sources
        run: |
          if [[ -z "$(git status --porcelain -- crates/ucof-experiments fuzz)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments fuzz
          git commit -m "style: normalize EXP-0002 rewrite experiments"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
