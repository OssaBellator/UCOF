name: Patch Phase 3 Rejection Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Accept all safe cycle rejection layers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-experiments/src/directory.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            DirectoryLookupError::PageCycle | DirectoryLookupError::ChildRangeMismatch
          ));'''
          new = '''            DirectoryLookupError::PageCycle
                  | DirectoryLookupError::ChildRangeMismatch
                  | DirectoryLookupError::OverlappingChildRange
          ));'''
          if old not in text:
              raise SystemExit("cycle assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src/directory.rs
          git commit -m "test: accept safe early cycle rejection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
