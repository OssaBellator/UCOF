name: Format Immutable Generated Vectors Once

on:
  pull_request:
    paths:
      - ".github/workflows/format-immutable-generated-vectors-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and test independent successor generators
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked -p ucof-experiments --test exp0002_immutable_generated_vectors -- -D warnings
          cargo test --locked -p ucof-experiments --test exp0002_immutable_generated_vectors -- --nocapture
      - name: Commit tested formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/tests/exp0002_immutable_generated_vectors.rs
          git rm .github/workflows/format-immutable-generated-vectors-once.yml
          git diff --cached --check
          git commit -m "test: format immutable successor generators"
          git push origin HEAD:phase-3/directory-snapshots-recovery
