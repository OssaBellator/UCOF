name: Spill Publication

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_spill_page_emission.py"
      - "tools/experiment_exp0002_staged_spill_merge.py"
      - "tools/experiment_exp0002_spill_publication.py"
      - "tools/experiment_exp0002_spill_security_policy.py"
      - "docs/experiments/0036-exp0002-spill-publication.md"
      - "docs/experiments/0045-exp0002-spill-security-policy.md"
      - ".github/workflows/spill-publication.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_spill_page_emission.py"
      - "tools/experiment_exp0002_staged_spill_merge.py"
      - "tools/experiment_exp0002_spill_publication.py"
      - "tools/experiment_exp0002_spill_security_policy.py"
      - "docs/experiments/0036-exp0002-spill-publication.md"
      - "docs/experiments/0045-exp0002-spill-security-policy.md"
      - ".github/workflows/spill-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise private spill lifecycle and atomic publication
        run: python3 tools/experiment_exp0002_spill_publication.py
      - name: Exercise ownership, cleanup, budgets, and durability policy
        run: python3 tools/experiment_exp0002_spill_security_policy.py
