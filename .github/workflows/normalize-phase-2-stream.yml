name: Normalize Phase 2 Stream

on:
  push:
    branches: ["phase-2/safety-first-core"]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add verified integrity state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-core/src/source.rs")
          text = path.read_text(encoding="utf-8")
          old = "    NotChecked,\n}"
          new = "    NotChecked,\n    /// The committed prefix digest was verified.\n    Verified,\n}"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "    Verified,\n}" not in text:
              raise SystemExit("integrity enum anchor not found")
          PY
      - name: Format sources
        run: cargo fmt --all
      - name: Commit normalized increment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "style: normalize sequential reader increment"
          git push origin HEAD:${{ github.ref_name }}
