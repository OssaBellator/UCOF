name: Patch Phase 3 Successor Evidence

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/patch-phase3-successor-evidence.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Reconcile status, security, and proposal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/PHASE_3_STATUS.md",
              """### Bounded external sort is feasible

          Experiment 0013 deterministically sorts 200,003 exact 88-byte locator-shaped entries using sub-megabyte spill runs and a k-way merge. Two run sizes produce identical output; missing and duplicate keys fail closed. Byte-producing writer integration and secure spill policy remain pending.
""".replace("          ", ""),
              """### Immutable-page successor evidence

          Experiment 0014 compares active snapshot sequence, page birth sequence, and immutable content identity. Immutable content identity is the only compared alternative that permits both exact historical reuse and identical-content deduplication; none supplies external freshness.

          At 100 million objects, Candidate 1 rewrites 542,671 pages or 8,891,121,664 bytes for one changed object. A batched immutable tree rewrites four pages or 65,536 bytes, a 135,667.75x difference.

          Experiment 0015 implements a byte-level immutable-page microformat. For 100,000 objects, one no-split replacement emits three pages and reuses 542 of 545 pages. A two-leaf batch emits five pages regardless of input update order. Strict traversal accepts mixed-age reachable pages, rejects corruption of a reused historical page at its page digest, rejects an interrupted latest footer, and preserves the earlier exact prefix.

          The microformat is not Candidate 2. Insertions, deletions, splits, merges, root-height changes, complete object records, roots, capabilities, cross-language vectors, source readers, and hostile-input corpus remain unimplemented for a successor.

          ### Spill-backed page emission is feasible

          Experiment 0013 proves bounded deterministic external sorting. Experiment 0016 feeds that merge directly into immutable page emission for 200,003 exact locator entries. Two run sizes and a directly sorted baseline produce the same 1,088 pages, root digest, and 17,825,792-byte output.

          The measured sort buffers are 360,448 and 684,376 bytes. Leaf and internal page groups remain approximately 16 KiB, while page-reference levels are spilled in fixed 64-byte records. Production staged merging, descriptor limits, temporary-file confidentiality, cleanup, disk exhaustion, and durable publication remain pending.

          ### Locator inventory crossover

          Experiment 0017 shows that the 56-byte minimal locator transfers fewer bytes than a tight 72-byte mirrored locator only below approximately 33.9% metadata-inventory coverage. Above that point, 48-byte object-header reads outweigh the directory saving and can add up to one range request per inspected object.

          Removing Candidate 1's 16-byte reserved tail is unconditionally beneficial for the compared fields. Identifier width and metadata mirroring remain separate decisions.
""".replace("          ", ""),
          )

          replace(
              "docs/PHASE_3_STATUS.md",
              "all framing, footer, scale, directory, page-size, COW, checkpoint, locator-width, page-reuse, HTTP-range, and external-sort experiments;",
              "all framing, footer, scale, directory, page-size, COW, checkpoint, locator-width, page-reuse, page-identity, immutable-page COW, HTTP-range, external-sort, spill-page-emission, and locator-inventory experiments;",
          )

          replace(
              "docs/PHASE_3_STATUS.md",
              """- Candidate 1 page-sequence semantics prohibit exact historical page reuse.
          - The append writer rebuilds all directory pages.
          - The final page identity, leaf layout, and object-identifier width are unresolved.
          - Full source readers are synchronous.
          - `Exp0002StableSource` requires transport-provided strong version evidence; concrete conditional HTTP/cloud adapters are not implemented.
          - Rewrite commands currently materialize source and output in memory.
          - The bounded external sort is a model, not yet integrated into the byte writer.
""".replace("          ", ""),
              """- Candidate 1 page-sequence semantics prohibit exact historical page reuse.
          - The Candidate 1 append writer rebuilds all directory pages.
          - Immutable content identity and no-split batched reuse are proven only in a successor microformat, not an independently implementable epoch.
          - Insertions, deletions, page splits and merges, root-height changes, complete object integration, and cross-language successor vectors are pending.
          - The final leaf layout and object-identifier width are unresolved.
          - Full source readers are synchronous.
          - `Exp0002StableSource` requires transport-provided strong version evidence; concrete conditional HTTP/cloud adapters are not implemented.
          - Rewrite commands currently materialize source and output in memory.
          - Spill sorting now feeds page emission, but staged merge, secure temporary-file lifecycle, resource exhaustion, and publication integration remain experimental.
""".replace("          ", ""),
          )

          replace(
              "docs/PHASE_3_STATUS.md",
              """1. Design and test revised immutable-page or page-birth-generation semantics that permit safe reuse.
          2. Implement a deterministic batched byte-level page-reuse writer for the revised semantics.
          3. Integrate bounded external sorting with object emission, page packing, failure cleanup, and final publication.
          4. Prototype a concrete conditional HTTP or cloud-object adapter using strong version evidence.
          5. Benchmark cold-cache inventory workloads for 88-, 72-, 56-, and 64-byte locator alternatives.
          6. Decide object-identifier width and leaf layout.
          7. Define normative minimum limits versus caller policy.
          8. Define future-field and capability-preservation rules.
          9. Define profile-supplied dependency and history-retention inputs for semantic compaction.
          10. Obtain an independently maintained implementation or external independent review.
          11. Resolve FCP-0002 objections before moving the proposal to Review.
""".replace("          ", ""),
              """1. Turn the immutable-page microformat into an independently implementable successor candidate with complete objects, roots, capabilities, source readers, and exact publication rules.
          2. Implement deterministic insertion, deletion, split, merge, root-height, and multi-level batched update vectors with cross-language valid and invalid corpora.
          3. Add staged external merge, descriptor and disk budgets, private spill lifecycle, cancellation cleanup, and durable publication to the successor writer.
          4. Prototype a concrete conditional HTTP or cloud-object adapter using strong version evidence.
          5. Weight lookup and inventory use cases, then decide metadata mirroring, object-identifier width, and final leaf layout.
          6. Define normative minimum limits versus caller policy.
          7. Define future-field and capability-preservation rules.
          8. Define profile-supplied dependency and history-retention inputs for semantic compaction.
          9. Obtain an independently maintained implementation or external independent review.
          10. Resolve FCP-0002 objections before moving the proposal to Review.
""".replace("          ", ""),
          )

          replace(
              "docs/security/EXP_0002_BYTE_FINDINGS.md",
              """The external sort is an algorithm model, not yet integrated into the byte writer or footer publication path.
""",
              """Experiment 0016 integrates the sorted locator stream with canonical immutable-page emission. For 200,003 entries, 4,096- and 7,777-entry run sizes and a directly sorted baseline produce the same 1,088 pages, root digest, and 17,825,792-byte output. Page-reference levels are themselves spilled rather than retained completely in memory.

          The integration remains a microformat rather than the Candidate 1 writer or a production spill subsystem. Staged merges, descriptor budgets, private temporary-file policy, cleanup after cancellation or crash, disk exhaustion, and durable publication remain unresolved.

          ## Successor page-identity evidence

          Experiment 0014 finds that immutable content identity permits both exact historical reuse and identical-content deduplication. Page birth sequence permits reuse but changes identical page bytes across births. Neither page age nor content identity provides external whole-file freshness.

          Experiment 0015 validates a mixed-age immutable tree at the byte level. A 100,000-object single update emits three pages and reuses 542 of 545. A two-leaf batch emits five pages independent of update order. Mutation of a reused page is detected by its authenticated page digest even though the page lies outside the current commit digest.

          This proves a viable direction but not a complete successor. Page splits, merges, insertion, deletion, complete object integration, cross-language vectors, recovery, and hostile-input evidence remain required.

          ## Locator inventory crossover

          Experiment 0017 adds workload evidence to the width table. A 56-byte minimal locator beats the tight 72-byte mirrored layout by total transferred bytes only below approximately 33.9% metadata-inventory coverage. Above that threshold, required 48-byte object-header reads outweigh the directory saving and may add one range request per inspected object.
""".replace("          ", ""),
          )

          replace(
              "docs/security/EXP_0002_BYTE_FINDINGS.md",
              "Page-size, locator-width, COW, checkpoint, page-reuse, HTTP-range, and external-sort experiments run continuously.",
              "Page-size, locator-width, locator-inventory, COW, checkpoint, page-reuse, page-identity, immutable-page COW, HTTP-range, external-sort, and spill-page-emission experiments run continuously.",
          )

          replace(
              "docs/security/EXP_0002_BYTE_FINDINGS.md",
              """- Candidate 1 page bytes prohibit historical page reuse and force directory rewrites.
          - The final page identity, leaf layout, and object-identifier width remain unresolved.
""".replace("          ", ""),
              """- Candidate 1 page bytes prohibit historical page reuse and force directory rewrites.
          - Immutable content identity and no-split path copying are proven only in a successor microformat; complete successor bytes and cross-language evidence are pending.
          - The final leaf layout, metadata mirroring policy, and object-identifier width remain unresolved.
""".replace("          ", ""),
          )

          replace(
              "docs/security/EXP_0002_BYTE_FINDINGS.md",
              "- External sorting is not integrated into the byte writer.",
              "- External sorting feeds immutable page emission experimentally, but production spill lifecycle, staged merge, resource exhaustion, and durable publication are unresolved.",
          )

          replace(
              "docs/security/EXP_0002_BYTE_FINDINGS.md",
              "FCP-0002 must not move to Review while Candidate 1 page identity prevents its intended reuse model, locator and identifier choices remain unresolved, the bounded external-sort prototype is not integrated into a failure-safe byte writer, concrete conditional remote-source adapters are absent, normative limits are undecided, and independent stewardship is missing.",
              "FCP-0002 must not move to Review until immutable-page successor bytes cover complete objects and structural features, split and merge behavior, cross-language vectors, hostile inputs, and failure-safe publication; locator and identifier choices remain unresolved; production spill and conditional remote-source policies are absent; normative limits are undecided; and independent stewardship is missing.",
          )

          replace(
              "docs/proposals/0002-exp-0002-directory-snapshots.md",
              """- bounded deterministic external-sort evidence;
          - 21 layer-targeted adversarial cases;
""".replace("          ", ""),
              """- bounded deterministic external-sort evidence;
          - page-identity comparison selecting immutable content identity as the simplest successor baseline;
          - a byte-level immutable-page COW microformat with deterministic one- and two-leaf batches;
          - spill-sorted locator streaming into deterministic immutable leaf and internal pages;
          - metadata-inventory crossover evidence for 56- versus 72-byte locators;
          - 21 layer-targeted adversarial cases;
""".replace("          ", ""),
          )

          replace(
              "docs/proposals/0002-exp-0002-directory-snapshots.md",
              """1. Replace Candidate 1 page-sequence semantics with independently implementable immutable-page or page-birth semantics, then implement a deterministic batched byte-level reuse writer and append-amplification vectors.
          2. Select or replace the 88-byte leaf layout and decide object-identifier width.
          3. Integrate bounded external sorting with page emission and define spill-file cleanup, confidentiality, descriptor, and storage-exhaustion policy.
""".replace("          ", ""),
              """1. Convert the immutable-page microformat into independently implementable successor bytes covering complete objects, roots, capabilities, insertion, deletion, splits, merges, root-height changes, source readers, recovery, cross-language vectors, invalid vectors, and bounded publication.
          2. Weight sparse lookup against broad inventory, then select metadata mirroring and object-identifier width; retire Candidate 1's 16-byte leaf reserve.
          3. Add staged merging and define spill-file cleanup, confidentiality, descriptor, storage-exhaustion, cancellation, crash-recovery, and durable-publication policy.
""".replace("          ", ""),
          )

          replace(
              "docs/proposals/0002-exp-0002-directory-snapshots.md",
              """- `docs/experiments/0013-exp0002-external-sort.md`
          - `docs/security/EXP_0002_MODEL_FINDINGS.md`
""".replace("          ", ""),
              """- `docs/experiments/0013-exp0002-external-sort.md`
          - `docs/experiments/0014-exp0002-page-identity-alternatives.md`
          - `docs/experiments/0015-exp0002-immutable-page-cow.md`
          - `docs/experiments/0016-exp0002-spill-page-emission.md`
          - `docs/experiments/0017-exp0002-locator-inventory-crossover.md`
          - `docs/security/EXP_0002_MODEL_FINDINGS.md`
""".replace("          ", ""),
          )
          PY
      - name: Verify document patches
        run: |
          git diff --check
          grep -q "Experiment 0017" docs/PHASE_3_STATUS.md
          grep -q "Successor page-identity evidence" docs/security/EXP_0002_BYTE_FINDINGS.md
          grep -q "0017-exp0002-locator-inventory-crossover" docs/proposals/0002-exp-0002-directory-snapshots.md
      - name: Commit evidence records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_3_STATUS.md docs/security/EXP_0002_BYTE_FINDINGS.md docs/proposals/0002-exp-0002-directory-snapshots.md
          git commit -m "docs: record immutable-page successor experiments"
          git push origin HEAD:phase-3/directory-snapshots-recovery
