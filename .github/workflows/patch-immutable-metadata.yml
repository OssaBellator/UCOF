name: Patch Immutable Metadata

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/patch-immutable-metadata.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Fix and verify metadata model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/experiment_exp0002_immutable_page_metadata.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if roots != sorted(roots) or any(
              root == 0 or left >= right for left, right in zip(roots, roots[1:])
          ):
          '''.replace("          ", "    ")
          new = '''    if roots != sorted(roots) or any(root == 0 for root in roots) or any(
              left >= right for left, right in zip(roots, roots[1:])
          ):
          '''.replace("          ", "    ")
          if text.count(old) != 1:
              raise SystemExit(f"metadata anchor count was {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/experiment_exp0002_immutable_page_metadata.py
      - name: Commit tested fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/experiment_exp0002_immutable_page_metadata.py
          git rm .github/workflows/patch-immutable-metadata.yml
          git diff --cached --check
          git commit -m "fix: validate immutable metadata root identifiers"
          git push origin HEAD:phase-3/directory-snapshots-recovery
