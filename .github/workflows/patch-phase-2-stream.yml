name: Patch Phase 2 Stream

on:
  push:
    branches: ["phase-2/safety-first-core"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply stream fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-core/src/stream.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''        let manifest = self
              .manifests
              .get(&footer.manifest_id)
              .ok_or(Error::MissingManifest(footer.manifest_id))?;''',
              '''        let manifest = self
              .manifests
              .get(&footer.manifest_id)
              .cloned()
              .ok_or(Error::MissingManifest(footer.manifest_id))?;''',
              1,
          )
          text = text.replace(
              '''            roots: manifest.roots.clone(),
            unsupported_required_capabilities: manifest.required_capabilities.clone(),''',
              '''            roots: manifest.roots,
            unsupported_required_capabilities: manifest.required_capabilities,''',
              1,
          )
          text = text.replace(
              '''    fn ensure_exact_end(&mut self) -> Result<(), Error> {
        self.check_file_budget(1)?;
        let mut byte = [0_u8; 1];''',
              '''    fn ensure_exact_end(&mut self) -> Result<(), Error> {
        let mut byte = [0_u8; 1];''',
              1,
          )
          text = text.replace(
              '''            Err(error) => Some(Err(error)),''',
              '''            Err(error) => {
                self.state = State::Done;
                Some(Err(error))
            }''',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format sources
        run: cargo fmt --all
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-core/src/stream.rs
          git commit -m "fix: make sequential commit validation borrow-safe"
          git push origin HEAD:${{ github.ref_name }}
