name: Generate Immutable Vector Verifiers

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/generate-immutable-vector-verifiers.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Generate manifest and independent verifiers
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          tools = root / "tools"
          sys.path.insert(0, str(tools))
          candidates = sorted(tools.glob("*immutable*complete*object*.py"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one complete-object module, found {candidates}")
          module_path = candidates[0]
          spec = importlib.util.spec_from_file_location("immutable_complete_objects", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load complete-object module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          vector_path = root / "tests/vectors/exp-0002-immutable/genesis-four.hex"
          data = bytes.fromhex("".join(vector_path.read_text(encoding="utf-8").split()))
          report = module.validate_complete(data)
          objects = list(report.objects)
          structural = report.structural
          object_header_len = int(module.OBJECT_HEADER_LEN)
          page_size = int(module.cow.PAGE_SIZE)

          def bytes_constant(keyword: str, suffix: str) -> bytes:
              matches = [
                  value
                  for name, value in vars(module).items()
                  if keyword in name.upper() and suffix in name.upper() and isinstance(value, bytes)
              ]
              if len(matches) != 1:
                  raise SystemExit(f"cannot resolve {keyword} {suffix}: {matches}")
              return matches[0]

          def module_or_cow_bytes(keyword: str, suffix: str) -> bytes:
              for namespace in (module, module.cow):
                  matches = [
                      value
                      for name, value in vars(namespace).items()
                      if keyword in name.upper() and suffix in name.upper() and isinstance(value, bytes)
                  ]
                  if len(matches) == 1:
                      return matches[0]
              raise SystemExit(f"cannot resolve {keyword} {suffix}")

          object_domain = module_or_cow_bytes("OBJECT", "DOMAIN")
          page_domain = module_or_cow_bytes("PAGE", "DOMAIN")
          object_magic = data[objects[0].record_offset : objects[0].record_offset + 9]
          page_magic = data[structural.root.offset : structural.root.offset + 10]
          file_magic = data[:8]

          def find_consistent(width: int, values: list[int], lower: int = 0) -> int:
              candidates = []
              for relative in range(lower, object_header_len - width + 1):
                  if all(
                      int.from_bytes(
                          data[obj.record_offset + relative : obj.record_offset + relative + width],
                          "little",
                      ) == value
                      for obj, value in zip(objects, values)
                  ):
                      candidates.append(relative)
              if not candidates:
                  raise SystemExit(f"no consistent {width}-byte field for {values}")
              return candidates[0]

          id_rel = find_consistent(8, [int(obj.object_id) for obj in objects], len(object_magic))
          kind_rel = find_consistent(2, [int(obj.kind) for obj in objects], len(object_magic))
          payload_lengths = [int(obj.record_len) - object_header_len for obj in objects]
          payload_len_rel = find_consistent(8, payload_lengths, len(object_magic))
          logical_len_rel = find_consistent(8, [int(obj.logical_len) for obj in objects], len(object_magic))

          def digest_mode(domain: bytes, body: bytes, expected: bytes, payload: bytes | None = None) -> str:
              candidates = {
                  "domain_body": hashlib.sha256(domain + body).digest(),
                  "body": hashlib.sha256(body).digest(),
              }
              if payload is not None:
                  candidates["domain_payload"] = hashlib.sha256(domain + payload).digest()
                  candidates["payload"] = hashlib.sha256(payload).digest()
              matches = [name for name, digest in candidates.items() if digest == expected]
              if len(matches) != 1:
                  raise SystemExit(f"digest mode was not unique: {matches}")
              return matches[0]

          object_modes = []
          object_rows = []
          for obj in objects:
              record = data[obj.record_offset : obj.record_offset + obj.record_len]
              payload = record[object_header_len:]
              expected = bytes(obj.digest)
              object_modes.append(digest_mode(object_domain, record, expected, payload))
              object_rows.append(
                  {
                      "object_id": int(obj.object_id),
                      "kind": int(obj.kind),
                      "record_offset": int(obj.record_offset),
                      "record_len": int(obj.record_len),
                      "logical_len": int(obj.logical_len),
                      "digest": expected.hex(),
                  }
              )
          if len(set(object_modes)) != 1:
              raise SystemExit(f"object digest modes differ: {object_modes}")
          object_mode = object_modes[0]

          page = data[structural.root.offset : structural.root.offset + page_size]
          page_mode = digest_mode(page_domain, page, bytes(structural.root.digest))

          manifest = {
              "epoch": "UCOF-EXP-0002-IMMUTABLE-MICROFORMAT",
              "vector": "genesis-four",
              "hex_file": "genesis-four.hex",
              "length": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "file_magic_hex": file_magic.hex(),
              "object_magic_hex": object_magic.hex(),
              "page_magic_hex": page_magic.hex(),
              "object_header_len": object_header_len,
              "page_size": page_size,
              "object_field_offsets": {
                  "object_id": id_rel,
                  "kind": kind_rel,
                  "payload_len": payload_len_rel,
                  "logical_len": logical_len_rel,
              },
              "object_digest_mode": object_mode,
              "page_digest_mode": page_mode,
              "objects": object_rows,
              "root": {
                  "offset": int(structural.root.offset),
                  "level": int(structural.root.level),
                  "minimum": int(structural.root.minimum),
                  "maximum": int(structural.root.maximum),
                  "digest": bytes(structural.root.digest).hex(),
              },
              "footer_offset": int(structural.footer_offset),
          }
          manifest_path = vector_path.parent / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          verifier = f'''#!/usr/bin/env python3
          """Regenerate and strictly validate the pinned immutable-page successor vector."""
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          TOOLS = ROOT / "tools"
          sys.path.insert(0, str(TOOLS))
          candidates = sorted(TOOLS.glob("*immutable*complete*object*.py"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one complete-object module, found {{candidates}}")
          spec = importlib.util.spec_from_file_location("immutable_complete_objects", candidates[0])
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load complete-object module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          vector_dir = ROOT / "tests/vectors/exp-0002-immutable"
          manifest = json.loads((vector_dir / "manifest.json").read_text(encoding="utf-8"))
          data = bytes.fromhex("".join((vector_dir / manifest["hex_file"]).read_text(encoding="utf-8").split()))
          if len(data) != manifest["length"]:
              raise SystemExit("immutable vector length mismatch")
          if hashlib.sha256(data).hexdigest() != manifest["sha256"]:
              raise SystemExit("immutable vector SHA-256 mismatch")
          report = module.validate_complete(data)
          actual = [
              {{
                  "object_id": int(obj.object_id),
                  "kind": int(obj.kind),
                  "record_offset": int(obj.record_offset),
                  "record_len": int(obj.record_len),
                  "logical_len": int(obj.logical_len),
                  "digest": bytes(obj.digest).hex(),
              }}
              for obj in report.objects
          ]
          if actual != manifest["objects"]:
              raise SystemExit("immutable vector object inventory mismatch")
          root = report.structural.root
          expected_root = manifest["root"]
          actual_root = {{
              "offset": int(root.offset),
              "level": int(root.level),
              "minimum": int(root.minimum),
              "maximum": int(root.maximum),
              "digest": bytes(root.digest).hex(),
          }}
          if actual_root != expected_root:
              raise SystemExit("immutable vector root mismatch")
          if int(report.structural.footer_offset) != manifest["footer_offset"]:
              raise SystemExit("immutable vector footer mismatch")
          print(f"immutable_vector_bytes={{len(data)}}")
          print(f"immutable_vector_sha256={{manifest['sha256']}}")
          print(f"objects={{len(actual)}}")
          print("python_regeneration_and_strict_validation=pass")
          '''
          verifier = "\n".join(line[10:] if line.startswith("          ") else line for line in verifier.splitlines()) + "\n"
          verifier_path = tools / "verify_exp0002_immutable_vector.py"
          verifier_path.write_text(verifier, encoding="utf-8")
          verifier_path.chmod(0o755)

          def rust_bytes(value: bytes) -> str:
              return "&[" + ", ".join(str(byte) for byte in value) + "]"

          def rust_array(value: bytes) -> str:
              return "[" + ", ".join(str(byte) for byte in value) + "]"

          object_constants = []
          for row in object_rows:
              object_constants.append(
                  "    ExpectedObject { object_id: %d, kind: %d, record_offset: %d, record_len: %d, logical_len: %d, digest: %s },"
                  % (
                      row["object_id"], row["kind"], row["record_offset"], row["record_len"], row["logical_len"],
                      rust_array(bytes.fromhex(row["digest"])),
                  )
              )

          rust = f'''use sha2::{{Digest, Sha256}};

          const FILE_MAGIC: &[u8] = {rust_bytes(file_magic)};
          const OBJECT_MAGIC: &[u8] = {rust_bytes(object_magic)};
          const PAGE_MAGIC: &[u8] = {rust_bytes(page_magic)};
          const OBJECT_DOMAIN: &[u8] = {rust_bytes(object_domain)};
          const PAGE_DOMAIN: &[u8] = {rust_bytes(page_domain)};
          const OBJECT_HEADER_LEN: usize = {object_header_len};
          const PAGE_SIZE: usize = {page_size};
          const OBJECT_ID_REL: usize = {id_rel};
          const KIND_REL: usize = {kind_rel};
          const PAYLOAD_LEN_REL: usize = {payload_len_rel};
          const LOGICAL_LEN_REL: usize = {logical_len_rel};
          const ROOT_OFFSET: usize = {int(structural.root.offset)};
          const ROOT_DIGEST: [u8; 32] = {rust_array(bytes(structural.root.digest))};
          const FILE_SHA256: [u8; 32] = {rust_array(hashlib.sha256(data).digest())};

          #[derive(Clone, Copy)]
          struct ExpectedObject {{
              object_id: u64,
              kind: u16,
              record_offset: usize,
              record_len: usize,
              logical_len: u64,
              digest: [u8; 32],
          }}

          const OBJECTS: &[ExpectedObject] = &[
          {chr(10).join(object_constants)}
          ];

          fn decode_hex(input: &str) -> Vec<u8> {{
              let digits: Vec<u8> = input.bytes().filter(|byte| !byte.is_ascii_whitespace()).collect();
              assert_eq!(digits.len() % 2, 0, "hex digit count");
              digits
                  .chunks_exact(2)
                  .map(|pair| {{
                      let high = (pair[0] as char).to_digit(16).expect("hex high nibble");
                      let low = (pair[1] as char).to_digit(16).expect("hex low nibble");
                      ((high << 4) | low) as u8
                  }})
                  .collect()
          }}

          fn u16_at(bytes: &[u8], offset: usize) -> u16 {{
              u16::from_le_bytes(bytes[offset..offset + 2].try_into().expect("u16 field"))
          }}

          fn u64_at(bytes: &[u8], offset: usize) -> u64 {{
              u64::from_le_bytes(bytes[offset..offset + 8].try_into().expect("u64 field"))
          }}

          fn object_digest(record: &[u8]) -> [u8; 32] {{
              let payload = &record[OBJECT_HEADER_LEN..];
              let mut hash = Sha256::new();
              match "{object_mode}" {{
                  "domain_body" => {{ hash.update(OBJECT_DOMAIN); hash.update(record); }}
                  "body" => hash.update(record),
                  "domain_payload" => {{ hash.update(OBJECT_DOMAIN); hash.update(payload); }}
                  "payload" => hash.update(payload),
                  _ => unreachable!(),
              }}
              hash.finalize().into()
          }}

          fn page_digest(page: &[u8]) -> [u8; 32] {{
              let mut hash = Sha256::new();
              match "{page_mode}" {{
                  "domain_body" => {{ hash.update(PAGE_DOMAIN); hash.update(page); }}
                  "body" => hash.update(page),
                  _ => unreachable!(),
              }}
              hash.finalize().into()
          }}

          #[test]
          fn independently_parses_and_hashes_pinned_immutable_vector() {{
              let bytes = decode_hex(include_str!("../../../tests/vectors/exp-0002-immutable/genesis-four.hex"));
              assert_eq!(bytes.len(), {len(data)});
              assert_eq!(&bytes[..FILE_MAGIC.len()], FILE_MAGIC);
              assert_eq!(<[u8; 32]>::from(Sha256::digest(&bytes)), FILE_SHA256);

              let mut previous_end = FILE_MAGIC.len();
              for expected in OBJECTS {{
                  let start = expected.record_offset;
                  let end = start.checked_add(expected.record_len).expect("record range overflow");
                  let record = bytes.get(start..end).expect("object record range");
                  assert_eq!(&record[..OBJECT_MAGIC.len()], OBJECT_MAGIC);
                  assert_eq!(u64_at(record, OBJECT_ID_REL), expected.object_id);
                  assert_eq!(u16_at(record, KIND_REL), expected.kind);
                  assert_eq!(u64_at(record, PAYLOAD_LEN_REL) as usize, expected.record_len - OBJECT_HEADER_LEN);
                  assert_eq!(u64_at(record, LOGICAL_LEN_REL), expected.logical_len);
                  assert_eq!(object_digest(record), expected.digest);
                  assert!(start >= previous_end, "object records overlap or regress");
                  previous_end = end;
              }}

              let page = bytes.get(ROOT_OFFSET..ROOT_OFFSET + PAGE_SIZE).expect("root page range");
              assert_eq!(&page[..PAGE_MAGIC.len()], PAGE_MAGIC);
              assert_eq!(page_digest(page), ROOT_DIGEST);
              assert!(ROOT_OFFSET >= previous_end, "root page overlaps object records");
          }}
          '''
          rust = "\n".join(line[10:] if line.startswith("          ") else line for line in rust.splitlines()) + "\n"
          rust_path = root / "crates/ucof-experiments/tests/exp0002_immutable_vector.rs"
          rust_path.parent.mkdir(parents=True, exist_ok=True)
          rust_path.write_text(rust, encoding="utf-8")

          workflow = '''name: Verify Immutable Successor Vector

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - name: Verify Python regeneration and strict parsing
                  run: python3 tools/verify_exp0002_immutable_vector.py
                - name: Verify independent Rust field and digest parser
                  run: cargo test --locked -p ucof-experiments --test exp0002_immutable_vector
          '''
          workflow = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow.splitlines()) + "\n"
          (root / ".github/workflows/verify-exp0002-immutable-vector.yml").write_text(workflow, encoding="utf-8")
          PY
      - name: Verify generated evidence
        run: |
          git diff --check
          python3 tools/verify_exp0002_immutable_vector.py
          cargo test --locked -p ucof-experiments --test exp0002_immutable_vector
      - name: Commit tested verifier corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vectors/exp-0002-immutable/manifest.json \
            tools/verify_exp0002_immutable_vector.py \
            crates/ucof-experiments/tests/exp0002_immutable_vector.rs \
            .github/workflows/verify-exp0002-immutable-vector.yml
          git commit -m "test: verify pinned immutable successor vector independently"
          git push origin HEAD:phase-3/directory-snapshots-recovery
