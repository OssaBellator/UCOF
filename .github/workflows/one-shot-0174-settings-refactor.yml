name: One-shot 0174 settings refactor

on:
  push:
    branches:
      - phase-3/fresh-lease-encrypted-restart-continuation

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Use typed fresh restart continuation settings'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/fresh-lease-encrypted-restart-continuation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor settings
        shell: python
        run: |
          from pathlib import Path

          impl = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation.rs')
          text = impl.read_text()

          old_sig = '''fn transcode_restart_spill_with_fresh_session(
              work_directory: &Path,
              persisted_stage: &File,
              manifest: LinuxEncryptedStageManifest,
              nonce_record: LinuxNonceJournalRecord,
              aes_key: &[u8; 32],
              options: super::ImmutableSourceStreamingWriteOptions,
              limits: super::ImmutableLimits,
              fresh_session: &mut DescriptorEncryptionSession,
          ) -> super::CandidateResult<(EncryptedDescriptorStage, RestartRecoveredPreflight)> {
          '''
          new_sig = '''#[derive(Clone, Copy)]
          struct RestartTranscodeSettings {
              options: super::ImmutableSourceStreamingWriteOptions,
              limits: super::ImmutableLimits,
          }

          fn transcode_restart_spill_with_fresh_session(
              work_directory: &Path,
              persisted_stage: &File,
              manifest: LinuxEncryptedStageManifest,
              nonce_record: LinuxNonceJournalRecord,
              aes_key: &[u8; 32],
              settings: RestartTranscodeSettings,
              fresh_session: &mut DescriptorEncryptionSession,
          ) -> super::CandidateResult<(EncryptedDescriptorStage, RestartRecoveredPreflight)> {
              let options = settings.options;
              let limits = settings.limits;
          '''
          if old_sig not in text:
              raise SystemExit('transcode signature pattern missing')
          text = text.replace(old_sig, new_sig, 1)

          old_continue = '''fn continue_verified_encrypted_spill_with_fresh_lease<W, S>(
              journal: &LinuxDurableNonceJournal,
              stage_directory_path: &Path,
              work_directory: &Path,
              writer: &mut W,
              sources: &mut [S],
              aes_key: [u8; 32],
              crashed_generation: u64,
              trusted_floor: Option<TrustedNonceFloor>,
              restart_limits: LinuxEncryptedStageRestartLimits,
              options: super::ImmutableSourceStreamingWriteOptions,
              limits: super::ImmutableLimits,
              fresh_operation_id: [u8; 16],
          ) -> super::CandidateResult<EncryptedRestartContinuationEvidence>
          where
              W: Write,
              S: super::ImmutableStreamingPayloadSource,
          {
          '''
          new_continue = '''#[derive(Clone, Copy)]
          struct EncryptedRestartContinuationSettings {
              aes_key: [u8; 32],
              crashed_generation: u64,
              trusted_floor: Option<TrustedNonceFloor>,
              restart_limits: LinuxEncryptedStageRestartLimits,
              options: super::ImmutableSourceStreamingWriteOptions,
              limits: super::ImmutableLimits,
              fresh_operation_id: [u8; 16],
          }

          fn continue_verified_encrypted_spill_with_fresh_lease<W, S>(
              journal: &LinuxDurableNonceJournal,
              stage_directory_path: &Path,
              work_directory: &Path,
              writer: &mut W,
              sources: &mut [S],
              settings: EncryptedRestartContinuationSettings,
          ) -> super::CandidateResult<EncryptedRestartContinuationEvidence>
          where
              W: Write,
              S: super::ImmutableStreamingPayloadSource,
          {
              let EncryptedRestartContinuationSettings {
                  aes_key,
                  crashed_generation,
                  trusted_floor,
                  restart_limits,
                  options,
                  limits,
                  fresh_operation_id,
              } = settings;
          '''
          if old_continue not in text:
              raise SystemExit('continuation signature pattern missing')
          text = text.replace(old_continue, new_continue, 1)

          old_call = '''        &aes_key,
                  options,
                  limits,
                  &mut fresh_session,
          '''
          new_call = '''        &aes_key,
                  RestartTranscodeSettings { options, limits },
                  &mut fresh_session,
          '''
          if old_call not in text:
              raise SystemExit('transcode call pattern missing')
          text = text.replace(old_call, new_call, 1)
          impl.write_text(text)

          tests = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation_tests.rs')
          text = tests.read_text()
          replacements = [
              ('''        aes_key,
                  1,
                  None,
                  restart_limits,
                  super::options(),
                  limits,
                  [0x73; 16],
          ''', '''        EncryptedRestartContinuationSettings {
                  aes_key,
                  crashed_generation: 1,
                  trusted_floor: None,
                  restart_limits,
                  options: super::options(),
                  limits,
                  fresh_operation_id: [0x73; 16],
              },
          '''),
              ('''        aes_key,
                  1,
                  None,
                  restart_limits,
                  super::options(),
                  limits,
                  [0x74; 16],
          ''', '''        EncryptedRestartContinuationSettings {
                  aes_key,
                  crashed_generation: 1,
                  trusted_floor: None,
                  restart_limits,
                  options: super::options(),
                  limits,
                  fresh_operation_id: [0x74; 16],
              },
          '''),
              ('''        aes_key,
                  1,
                  None,
                  restart_limits,
                  super::options(),
                  super::ImmutableLimits::default(),
                  [0x75; 16],
          ''', '''        EncryptedRestartContinuationSettings {
                  aes_key,
                  crashed_generation: 1,
                  trusted_floor: None,
                  restart_limits,
                  options: super::options(),
                  limits: super::ImmutableLimits::default(),
                  fresh_operation_id: [0x75; 16],
              },
          '''),
              ('''        aes_key,
                  1,
                  None,
                  restart_limits,
                  super::options(),
                  super::ImmutableLimits::default(),
                  [0x76; 16],
          ''', '''        EncryptedRestartContinuationSettings {
                  aes_key,
                  crashed_generation: 1,
                  trusted_floor: None,
                  restart_limits,
                  options: super::options(),
                  limits: super::ImmutableLimits::default(),
                  fresh_operation_id: [0x76; 16],
              },
          '''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('continuation test call pattern missing')
              text = text.replace(old, new, 1)
          tests.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation.rs crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation_tests.rs
          git commit -m 'Use typed fresh restart continuation settings'
          git push origin HEAD:phase-3/fresh-lease-encrypted-restart-continuation
