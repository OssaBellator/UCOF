name: Lock explicit AWS-LC edge

on:
  push:
    branches:
      - phase-3/encrypted-descriptor-writer-integration

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockgen]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/encrypted-descriptor-writer-integration
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate minimal lock update
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock Cargo.lock.before
          cargo metadata --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          before = Path('Cargo.lock.before').read_text()
          after = Path('Cargo.lock').read_text()
          needle = '''[[package]]\nname = "ucof-experiments"\nversion = "0.1.0"\ndependencies = [\n "reqwest",\n "sha2",\n "tokio",\n]\n'''
          replacement = '''[[package]]\nname = "ucof-experiments"\nversion = "0.1.0"\ndependencies = [\n "aws-lc-rs",\n "reqwest",\n "sha2",\n "tokio",\n]\n'''
          expected = before.replace(needle, replacement, 1)
          if expected == before:
              raise SystemExit('ucof-experiments lock entry not found exactly once')
          if after != expected:
              import difflib
              print(''.join(difflib.unified_diff(expected.splitlines(True), after.splitlines(True), fromfile='expected', tofile='actual')))
              raise SystemExit('Cargo changed more than the explicit aws-lc-rs dependency edge')
          PY
          rm Cargo.lock.before
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Lock explicit AWS-LC dependency [lockgen]"
          git push origin HEAD:phase-3/encrypted-descriptor-writer-integration
