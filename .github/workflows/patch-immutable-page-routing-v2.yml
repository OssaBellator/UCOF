name: Patch Immutable Page Routing V2

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/patch-immutable-page-routing-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Define canonical gap routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/experiment_exp0002_immutable_page_splits.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    child_index = next(\n", text.index("    children = ["))
          end = text.index("    replacements = insert_node", start)
          replacement = '''    child_index = next(
              (index for index, child in enumerate(children) if value.object_id <= child.maximum),
              len(children) - 1,
          )
          '''.replace("          ", "    ")
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Execute focused and sequence prototypes
        run: |
          python3 tools/experiment_exp0002_immutable_page_splits.py
          python3 tools/experiment_exp0002_immutable_page_sequences.py
      - name: Commit tested routing rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/experiment_exp0002_immutable_page_splits.py
          git diff --cached --check
          git commit -m "fix: define canonical immutable-page gap routing"
          git push origin HEAD:phase-3/directory-snapshots-recovery
