name: Append real journal HMAC

on:
  push:
    branches:
      - phase-3/real-journal-hmac

permissions:
  contents: write

jobs:
  append:
    if: ${{ !contains(github.event.head_commit.message, '[hmacgen]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/real-journal-hmac
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Append real HMAC authenticator and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ucof-experiments/src/private_restart_journal_contract_v2.rs')
          text = path.read_text()
          marker = 'struct AwsLcHmacJournalAuthenticator'
          if marker in text:
              raise SystemExit('real HMAC module already present')
          append = r'''

          #[cfg(all(target_os = "linux", target_arch = "x86_64"))]
          mod real_hmac_authenticator_tests {
              use super::*;
              use aws_lc_rs::hmac;

              const HMAC_TAG_LEN: usize = 32;

              struct AwsLcHmacJournalAuthenticator {
                  key: hmac::Key,
              }

              impl AwsLcHmacJournalAuthenticator {
                  fn new(key: [u8; 32]) -> Self {
                      Self {
                          key: hmac::Key::new(hmac::HMAC_SHA256, &key),
                      }
                  }
              }

              impl JournalAuthenticator for AwsLcHmacJournalAuthenticator {
                  fn seal(&self, plaintext: &[u8]) -> Result<Vec<u8>, JournalError> {
                      let tag = hmac::sign(&self.key, plaintext);
                      let mut sealed = Vec::with_capacity(plaintext.len() + HMAC_TAG_LEN);
                      sealed.extend_from_slice(plaintext);
                      sealed.extend_from_slice(tag.as_ref());
                      Ok(sealed)
                  }

                  fn open(&self, sealed: &[u8]) -> Result<Vec<u8>, JournalError> {
                      let plaintext_len = sealed
                          .len()
                          .checked_sub(HMAC_TAG_LEN)
                          .ok_or(JournalError::AuthenticationFailed)?;
                      let (plaintext, tag) = sealed.split_at(plaintext_len);
                      hmac::verify(&self.key, plaintext, tag)
                          .map_err(|_| JournalError::AuthenticationFailed)?;
                      Ok(plaintext.to_vec())
                  }
              }

              fn artifact(kind: ArtifactKind, segment_id: u64, byte: u8) -> JournalArtifact {
                  JournalArtifact {
                      kind,
                      segment_id,
                      bytes: 4096 + segment_id,
                      sha256: [byte; 32],
                  }
              }

              fn constructing_journal() -> RestartJournal {
                  RestartJournal::new([0x11; 16], [0x22; 16])
                      .expect("journal")
                      .checkpoint(
                          JournalState::Constructing,
                          Some(17),
                          vec![
                              artifact(ArtifactKind::Descriptor, 1, 0x31),
                              artifact(ArtifactKind::Output, 2, 0x32),
                          ],
                          8,
                      )
                      .expect("constructing checkpoint")
              }

              #[test]
              fn real_hmac_round_trip_preserves_restart_authority_and_inventory() {
                  let authenticator = AwsLcHmacJournalAuthenticator::new([0x41; 32]);
                  let journal = constructing_journal();
                  let plaintext = encode_journal(&journal).expect("encode");
                  let sealed = seal_journal(&journal, &authenticator).expect("seal");
                  assert_eq!(sealed.len(), plaintext.len() + HMAC_TAG_LEN);
                  assert_eq!(&sealed[..plaintext.len()], plaintext.as_slice());

                  let opened = open_journal(
                      &sealed,
                      &authenticator,
                      journal.operation_id,
                      journal.key_id,
                      journal.generation,
                      journal.next_nonce,
                      8,
                  )
                  .expect("open real HMAC journal");
                  assert_eq!(opened, journal);
                  assert_eq!(opened.authority(), RecoveryAuthority::ResumeOrDiscardPrivate);
              }

              #[test]
              fn field_tag_truncation_and_wrong_mac_key_fail_authentication() {
                  let authenticator = AwsLcHmacJournalAuthenticator::new([0x42; 32]);
                  let wrong_authenticator = AwsLcHmacJournalAuthenticator::new([0x43; 32]);
                  let journal = constructing_journal();
                  let sealed = seal_journal(&journal, &authenticator).expect("seal");
                  let plaintext_len = sealed.len() - HMAC_TAG_LEN;

                  for offset in [
                      0usize,
                      8,
                      16,
                      32,
                      48,
                      56,
                      64,
                      95,
                      plaintext_len - 1,
                      sealed.len() - 1,
                  ] {
                      let mut tampered = sealed.clone();
                      tampered[offset] ^= 0x80;
                      assert_eq!(
                          authenticator.open(&tampered).expect_err("tamper must fail"),
                          JournalError::AuthenticationFailed
                      );
                  }

                  for cut in 0..sealed.len() {
                      assert_eq!(
                          authenticator
                              .open(&sealed[..cut])
                              .expect_err("truncation must fail"),
                          JournalError::AuthenticationFailed
                      );
                  }

                  assert_eq!(
                      wrong_authenticator
                          .open(&sealed)
                          .expect_err("wrong HMAC key must fail"),
                      JournalError::AuthenticationFailed
                  );
              }

              #[test]
              fn valid_mac_still_enforces_operation_key_and_authenticated_rollback_guards() {
                  let authenticator = AwsLcHmacJournalAuthenticator::new([0x44; 32]);
                  let old = constructing_journal();
                  let old_sealed = seal_journal(&old, &authenticator).expect("seal old");

                  assert_eq!(
                      open_journal(
                          &old_sealed,
                          &authenticator,
                          [0x12; 16],
                          old.key_id,
                          old.generation,
                          old.next_nonce,
                          8,
                      )
                      .expect_err("foreign operation"),
                      JournalError::ForeignOperation
                  );
                  assert_eq!(
                      open_journal(
                          &old_sealed,
                          &authenticator,
                          old.operation_id,
                          [0x23; 16],
                          old.generation,
                          old.next_nonce,
                          8,
                      )
                      .expect_err("foreign key id"),
                      JournalError::ForeignKey
                  );

                  let current = old
                      .checkpoint(
                          JournalState::PrivateSynced,
                          Some(33),
                          old.artifacts.clone(),
                          8,
                      )
                      .expect("newer checkpoint");
                  assert_eq!(
                      open_journal(
                          &old_sealed,
                          &authenticator,
                          old.operation_id,
                          old.key_id,
                          current.generation,
                          old.next_nonce,
                          8,
                      )
                      .expect_err("old valid generation must fail"),
                      JournalError::GenerationRollback
                  );
                  assert_eq!(
                      open_journal(
                          &old_sealed,
                          &authenticator,
                          old.operation_id,
                          old.key_id,
                          old.generation,
                          Some(18),
                          8,
                      )
                      .expect_err("old valid nonce high-water must fail"),
                      JournalError::NonceRollback
                  );

                  let current_sealed = seal_journal(&current, &authenticator).expect("seal current");
                  assert_eq!(
                      open_journal(
                          &current_sealed,
                          &authenticator,
                          current.operation_id,
                          current.key_id,
                          current.generation,
                          current.next_nonce,
                          8,
                      )
                      .expect("current opens"),
                      current
                  );
              }

              #[test]
              fn real_hmac_is_deterministic_and_data_sensitive() {
                  let authenticator = AwsLcHmacJournalAuthenticator::new([0x45; 32]);
                  let journal = constructing_journal();
                  let first = seal_journal(&journal, &authenticator).expect("first seal");
                  let second = seal_journal(&journal, &authenticator).expect("second seal");
                  assert_eq!(first, second);

                  let changed = journal
                      .checkpoint(
                          JournalState::PrivateSynced,
                          Some(18),
                          journal.artifacts.clone(),
                          8,
                      )
                      .expect("changed checkpoint");
                  let changed = seal_journal(&changed, &authenticator).expect("changed seal");
                  assert_ne!(first, changed);
              }
          }
          '''
          path.write_text(text.rstrip() + '\n' + append.lstrip())
          PY
          cargo fmt --all
          cargo test --locked -p ucof-experiments private_restart_journal_contract_v2::real_hmac_authenticator_tests
      - name: Commit appended HMAC source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src/private_restart_journal_contract_v2.rs
          git diff --cached --quiet && exit 0
          git commit -m "Add real HMAC restart journal authentication [hmacgen]"
          git push origin HEAD:phase-3/real-journal-hmac
