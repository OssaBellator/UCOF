name: Format Immutable Successor API Once

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - "crates/ucof-experiments/src/immutable_successor.rs"
      - "crates/ucof-experiments/src/lib.rs"
      - "crates/ucof-experiments/tests/immutable_successor_api.rs"
      - ".github/workflows/format-immutable-successor-api-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add structural cross-checks and normalize source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ucof-experiments/src/immutable_successor.rs")
          text = path.read_text(encoding="utf-8")

          overlap_needle = '''    if end > snapshot_offset {
        return Err(ImmutableError::Invalid("page range"));
    }
    if seen.len() >= limits.max_pages {
'''
          overlap_replacement = '''    if end > snapshot_offset {
        return Err(ImmutableError::Invalid("page range"));
    }
    if structural_ranges
        .iter()
        .any(|(start, stop)| offset < *stop && *start < end)
    {
        return Err(ImmutableError::Invalid("page overlap"));
    }
    if seen.len() >= limits.max_pages {
'''
          if overlap_needle not in text:
              raise SystemExit("page-overlap insertion point not found")
          text = text.replace(overlap_needle, overlap_replacement, 1)

          count_needle = '''    while let Some(reference) = stack.pop() {
        parse_page(
            data,
            &reference,
            snapshot_offset,
            limits,
            &mut seen,
            &mut stack,
            &mut locators,
            &mut structural_ranges,
        )?;
    }
    if locators.is_empty()
'''
          count_replacement = '''    while let Some(reference) = stack.pop() {
        parse_page(
            data,
            &reference,
            snapshot_offset,
            limits,
            &mut seen,
            &mut stack,
            &mut locators,
            &mut structural_ranges,
        )?;
    }
    let current_pages = seen
        .iter()
        .filter(|offset| **offset >= commit_start)
        .count();
    if footer.page_count_current != u64_from_usize(current_pages)? {
        return Err(ImmutableError::Invalid("page count"));
    }
    if locators.is_empty()
'''
          if count_needle not in text:
              raise SystemExit("page-count insertion point not found")
          text = text.replace(count_needle, count_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/format-immutable-successor-api-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src/immutable_successor.rs \
            crates/ucof-experiments/src/lib.rs \
            crates/ucof-experiments/tests/immutable_successor_api.rs \
            .github/workflows/format-immutable-successor-api-once.yml
          git diff --cached --check
          git commit -m "style: format immutable successor API"
          git push origin HEAD:phase-3/directory-snapshots-recovery
