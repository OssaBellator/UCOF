name: Rust

on:
  push:
    branches: [main, "phase-1/**", "phase-2/**", "phase-3/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust implementation
        run: cargo test --locked --workspace --all-targets
      - name: Reproduce deletion policy trace
        run: cargo run --locked -p ucof-experiments --example exp0003_delete_policy_trace
      - name: Test Rust documentation
        run: cargo test --locked --workspace --doc
      - name: Test independent Python parser
        run: python3 tools/validate_exp_0001.py --vectors tests/vectors/exp-0001
      - name: Test adversarial Python cases
        run: python3 tools/test_exp_0001_adversarial.py
      - name: Test independent Phase 3 models
        run: python3 tools/validate_phase3_models.py
      - name: Test independent EXP-0002 codec
        run: |
          python3 tools/exp0002_codec.py --self-test
          python3 tools/exp0002_codec.py --verify-vectors tests/vectors/exp-0002
      - name: Test EXP-0002 adversarial corpus
        run: python3 tools/test_exp0002_adversarial.py
      - name: Verify pinned EXP-0002 invalid corpus
        run: python3 tools/exp0002_invalid_vectors.py --verify-vectors tests/vectors/exp-0002-invalid
      - name: Verify immutable successor invalid recipes
        run: python3 tools/verify_exp0002_immutable_invalid_recipes.py
      - name: Regenerate immutable successor vector recipes
        run: python3 tools/verify_exp0002_immutable_generated_recipes.py
      - name: Verify conditional retry traces
        run: python3 tools/verify_exp0002_immutable_retry_traces.py
      - name: Verify conditional HTTP classification traces
        run: python3 tools/verify_conditional_http_classification_traces.py
      - name: Reproduce framing experiments
        run: |
          python3 tools/experiment_framing_widths.py
          python3 tools/experiment_footer_discovery.py
          python3 tools/experiment_scale_limits.py
          python3 tools/experiment_directory_models.py
          python3 tools/experiment_exp0002_page_sizes.py
          python3 tools/experiment_exp0002_cow_reuse.py
          python3 tools/experiment_exp0002_checkpoint_cadence.py
          python3 tools/experiment_exp0003_page_size.py > /dev/null
          python3 tools/experiment_exp0003_id_width.py > /dev/null
          python3 tools/experiment_exp0003_cost_envelope.py > /dev/null
          python3 tools/experiment_exp0003_mixed_leaf_restructuring.py --quick > /dev/null
          python3 tools/experiment_exp0003_history_independent_partition.py --quick > /dev/null

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.85.0
      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets

  portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    matrix:
      target:
        - i686-unknown-linux-gnu
        - powerpc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Install 32-bit linker support
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Check portability target
        run: cargo check --locked --workspace --all-targets --target ${{ matrix.target }}
