name: Rust

on:
  push:
    branches: [main, "phase-1/**", "phase-2/**", "phase-3/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust implementation
        run: cargo test --locked --workspace --all-targets
      - name: Test Rust documentation
        run: cargo test --locked --workspace --doc
      - name: Test independent Python parser
        run: python3 tools/validate_exp_0001.py --vectors tests/vectors/exp-0001
      - name: Test adversarial Python cases
        run: python3 tools/test_exp_0001_adversarial.py
      - name: Reproduce framing experiments
        run: |
          python3 tools/experiment_framing_widths.py
          python3 tools/experiment_footer_discovery.py
          python3 tools/experiment_scale_limits.py
          python3 tools/experiment_directory_models.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85.0
      - name: Check workspace at MSRV
        run: cargo check --locked --workspace --all-targets

  portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check all libraries for target
        run: cargo check --locked --workspace --lib --target ${{ matrix.target }}
