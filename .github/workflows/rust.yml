name: Rust

on:
  push:
    branches: [main, "phase-1/**", "phase-2/**", "phase-3/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust implementation
        run: cargo test --locked --workspace --all-targets
      - name: Test Rust documentation
        run: cargo test --locked --workspace --doc
      - name: Test independent Python parser
        run: python3 tools/validate_exp_0001.py --vectors tests/vectors/exp-0001
      - name: Test adversarial Python cases
        run: python3 tools/test_exp_0001_adversarial.py
      - name: Test independent Phase 3 models
        run: python3 tools/validate_phase3_models.py
      - name: Test independent EXP-0002 codec
        run: |
          python3 tools/exp0002_codec.py --self-test
          python3 tools/exp0002_codec.py --verify-vectors tests/vectors/exp-0002
      - name: Test EXP-0002 adversarial corpus
        run: python3 tools/test_exp0002_adversarial.py
      - name: Reproduce framing experiments
        run: |
          python3 tools/experiment_framing_widths.py
          python3 tools/experiment_footer_discovery.py
          python3 tools/experiment_scale_limits.py
          python3 tools/experiment_directory_models.py
          python3 tools/experiment_exp0002_page_sizes.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85.0
      - name: Check workspace at MSRV
        run: cargo check --locked --workspace --all-targets

  portability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check all libraries for target
        run: cargo check --locked --workspace --lib --target ${{ matrix.target }}

  integrate:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Synchronize concrete EXP-0002 evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status_path = Path("docs/PHASE_3_STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          replacements = {
              "| Security findings | Model findings published; byte findings in progress | security documents |":
                  "| Security findings | Model and concrete-byte findings published | security documents |",
              "| Random-access source without full slice | Pending | next I/O frontier |":
                  "| Random-access source without full slice | Implemented and tested | `lookup_authenticated_at` |",
              "The targeted lookup verifies the active commit, snapshot, one page path, and selected object. It does not claim that unrelated historical object records were rehashed.":
                  "The targeted lookup verifies the active commit, snapshot, one page path, and selected object. It does not claim that unrelated historical object records were rehashed. The range-source implementation streams commit and object hashing under read-operation, byte, request-size, page, and hash budgets; a test proves that lookup of a small historical root does not read an unrelated one-megabyte historical payload.",
              "- eighteen cargo-fuzz target builds and bounded pull-request smoke campaigns.":
                  "- nineteen cargo-fuzz target builds and bounded pull-request smoke campaigns.",
              "The eighteen fuzz targets consist of six inherited Phase 2 byte targets, seven Phase 3 algorithm-model targets, and five concrete EXP-0002 targets for strict validation, recovery, writer round trips, authenticated lookup, and rewrite output.":
                  "The nineteen fuzz targets consist of six inherited Phase 2 byte targets, seven Phase 3 algorithm-model targets, and six concrete EXP-0002 targets for strict validation, recovery, writer round trips, in-memory lookup, range-source lookup, and rewrite output.",
              "- all concrete EXP-0002 APIs currently operate on in-memory byte slices;":
                  "- full strict validation, backward recovery scanning, and rewrite currently operate on in-memory byte slices; authenticated lookup also has a bounded range-source implementation;",
              "- strict and targeted readers are synchronous;":
                  "- strict and targeted readers are synchronous, and range-source validation assumes one stable source view for the operation;",
              "- authenticated single-object lookup and absence proof exist;":
                  "- authenticated single-object lookup and absence proof exist over both slices and bounded random-access sources;",
              "- concrete parsers, lookup, recovery, writers, and rewrite paths are continuously fuzzed;":
                  "- concrete parsers, slice and range-source lookup, recovery, writers, and rewrite paths are continuously fuzzed;",
              "1. move authenticated lookup and recovery onto a bounded random-access source abstraction without materialising the whole file;":
                  "1. move full strict validation and recovery scanning onto bounded random-access sources without materialising the whole file;",
              "7. integrate concrete-byte findings into the primary threat model and FCP-0002 evidence section;":
                  "7. pin invalid and interrupted vectors with stable cross-language expected outcomes and decide the public error-category contract;",
          }
          for old, new in replacements.items():
              if old in status:
                  status = status.replace(old, new, 1)
              elif new not in status:
                  raise SystemExit(f"status anchor not found: {old[:80]}")
          status_path.write_text(status, encoding="utf-8")

          threat_path = Path("docs/THREAT_MODEL.md")
          threat = threat_path.read_text(encoding="utf-8")
          marker = "## 17. Executable findings from UCOF-EXP-0002 Candidate 1"
          if marker not in threat:
              threat = threat.rstrip() + r'''

## 17. Executable findings from UCOF-EXP-0002 Candidate 1

Candidate 1 adds exact experimental bytes for authenticated pages, complete snapshots, append commits, recovery, lookup, repair, and compaction. The candidate remains disposable and Draft. Detailed evidence is recorded in `docs/security/EXP_0002_BYTE_FINDINGS.md`.

### 17.1 Serialized-structure controls

The Rust and independent Python readers enforce exact magic, version, length, little-endian fields, zero flags, zero reserved bytes, zero page padding, checked range arithmetic, and explicit SHA-256 algorithm identifiers. Object, page, snapshot, and commit hashes use separate domain prefixes.

An authenticated outer digest does not replace inner validation. Layer-targeted adversarial cases recompute outer hashes and still reach rejection for non-zero padding, forged child ranges, inconsistent levels, invalid parent links, object-header disagreement, and physical overlap.

### 17.2 Directory and lookup findings

Candidate 1 pages require sorted unique leaf keys, sorted non-overlapping child ranges, exact child levels, exact 16 KiB page lengths, complete-page digests, and cycle or repeated-offset rejection during full traversal.

The full strict reader validates every referenced object. Narrow authenticated lookup instead validates the exact-end footer, current commit, active snapshot, one root-to-leaf path, and the selected object. It may return authenticated absence but does not claim unrelated historical objects were rehashed.

A bounded random-access source implementation streams current-commit and selected-object hashing, limits read operations, bytes, request size, pages, and hashed bytes, and demonstrates that a small historical-object lookup does not read an unrelated one-megabyte historical payload. The source must remain stable for the operation; remote version-token and mutation rules are not yet defined.

### 17.3 Publication and recovery findings

Only a complete 160-byte footer at exact file end publishes the latest snapshot. Every tested incomplete append fails strict validation. Recovery is separately requested and independently bounds scan bytes, magic matches, candidate validations, results, and previous-chain depth.

Footer magic and previous-footer pointers have no authority by themselves. Every reported recovery candidate is strictly validated as an exact-end prefix. Equal verified forks remain ambiguous rather than being silently selected.

### 17.4 Identity, repair, and compaction findings

ADR-0011 separates structural snapshot identity from file-instance commit identity. A deterministic repair can preserve an identical snapshot digest while always publishing a newly computed commit digest. This does not preserve the original file instance or byte-scoped signatures.

Repair and caller-directed rewrite accept only strictly verified sources, copy authenticated payload ranges, enforce object, copied-byte, and output-byte limits, require retained roots, validate generated output, and never claim automatic semantic dependency discovery.

### 17.5 Differential, adversarial, and portability evidence

- Rust and independent Python implementations produce byte-identical genesis, append, and multi-leaf vectors;
- both implementations continuously validate the pinned corpus;
- 21 layer-targeted adversarial cases exercise headers, objects, pages, padding, parent links, footers, exact-end state, and append truncation;
- page-size experiments compare 4 KiB, 16 KiB, and 64 KiB pages using the actual Candidate 1 entry widths;
- nineteen fuzz targets cover inherited byte paths, Phase 3 models, and concrete strict, recovery, writer, lookup, range-source, and rewrite paths;
- the workspace compiles at Rust 1.85, on 32-bit little-endian, and on 64-bit big-endian targets.

### 17.6 Residual risks and open controls

- SHA-256 integrity is not authenticity, signer trust, confidentiality, or external freshness;
- a valid older whole file can be replayed without external trusted state;
- full strict validation and backward recovery scanning still operate on in-memory slices;
- range-source readers assume a stable source view for one operation;
- the writer rebuilds every directory page and has no copy-on-write reuse;
- progress checkpoint bytes and normative recovery-limit minima are unresolved;
- 88-byte leaf entries dominate large-directory space;
- invalid vectors are exercised but are not yet pinned as a cross-language public corpus;
- both current implementations share one repository and may share a specification misunderstanding;
- profiles, schemas, transforms, compression, signatures, provenance, encryption, and external references remain outside Candidate 1.

FCP-0002 must not enter Review until remaining implementation-blocking questions, realistic range-I/O evidence, checkpoint and page-reuse semantics, invalid-vector expectations, and independent stewardship are addressed.
'''
          threat_path.write_text(threat + "\n", encoding="utf-8")
          PY
      - name: Commit synchronized docs
        run: |
          if git diff --quiet -- docs/PHASE_3_STATUS.md docs/THREAT_MODEL.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_3_STATUS.md docs/THREAT_MODEL.md
          git commit -m "docs: integrate concrete EXP-0002 evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
