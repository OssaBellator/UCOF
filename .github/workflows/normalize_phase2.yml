name: Normalize Phase 2 Frontiers

on:
  push:
    branches: ["phase-2/safety-first-core"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize sources and lockfile
        run: |
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
          cargo generate-lockfile
      - name: Commit normalization
        run: |
          if [[ -z "$(git status --porcelain -- Cargo.lock crates fuzz)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates fuzz
          git commit -m "style: normalize Phase 2 frontier sources and lockfile"
          git push origin HEAD:${{ github.ref_name }}
