name: Normalize EXP-0002 Source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatted source
        run: |
          if git diff --quiet -- crates/ucof-experiments/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucof-experiments/src
          git commit -m "style: format EXP-0002 byte codec"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
