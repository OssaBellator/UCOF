name: Synchronize EXP-0002 Evidence

on:
  push:
    branches: ["phase-3/**"]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Synchronize documentation
        run: python3 tools/sync_exp0002_evidence.py
      - name: Commit documentation
        run: |
          if git diff --quiet -- docs/PHASE_3_STATUS.md docs/THREAT_MODEL.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_3_STATUS.md docs/THREAT_MODEL.md
          git commit -m "docs: integrate concrete EXP-0002 evidence"
          git push origin HEAD:${{ github.ref_name }}
