name: One-shot 0174 seek fix

on:
  push:
    branches:
      - phase-3/fresh-lease-encrypted-restart-continuation

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix fresh restart seek trait scope'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/fresh-lease-encrypted-restart-continuation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch seek call
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation.rs')
          text = path.read_text()
          old = '    reader\n        .seek(SeekFrom::Start(0))\n'
          new = '    std::io::Seek::seek(&mut reader, std::io::SeekFrom::Start(0))\n'
          if old not in text:
              raise SystemExit('0174 seek pattern missing')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ucof-experiments/src/immutable_successor/bounded_end_to_end_candidate/encrypted_restart_continuation.rs
          git commit -m 'Fix fresh restart seek trait scope'
          git push origin HEAD:phase-3/fresh-lease-encrypted-restart-continuation
