name: Cleanup Immutable Vector Generator

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/cleanup-immutable-vector-generator.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Require and verify generated evidence
        run: |
          test -f tests/vectors/exp-0002-immutable/manifest.json
          test -f tools/verify_exp0002_immutable_vector.py
          test -f crates/ucof-experiments/tests/exp0002_immutable_vector.rs
          test -f .github/workflows/verify-exp0002-immutable-vector.yml
          python3 tools/verify_exp0002_immutable_vector.py
          cargo test --locked -p ucof-experiments --test exp0002_immutable_vector
      - name: Remove write-capable helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-immutable-vector-verifiers.yml
          git rm .github/workflows/cleanup-immutable-vector-generator.yml
          git commit -m "chore: remove immutable vector write helpers"
          git push origin HEAD:phase-3/directory-snapshots-recovery
