name: Immutable Page Splits

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "docs/experiments/0023-exp0002-immutable-page-splits.md"
      - ".github/workflows/immutable-page-splits.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "docs/experiments/0023-exp0002-immutable-page-splits.md"
      - ".github/workflows/immutable-page-splits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise immutable page insertion, split, merge, and collapse
        run: python3 tools/experiment_exp0002_immutable_page_splits.py
