name: Immutable Page Object History

on:
  pull_request:
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_objects.py"
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_recursive_delete.py"
      - "tools/experiment_exp0002_immutable_page_object_history.py"
      - "docs/experiments/0032-exp0002-immutable-page-object-history.md"
      - ".github/workflows/immutable-page-object-history.yml"
  push:
    branches: ["phase-3/**"]
    paths:
      - "tools/experiment_exp0002_immutable_page_cow.py"
      - "tools/experiment_exp0002_immutable_page_objects.py"
      - "tools/experiment_exp0002_immutable_page_splits.py"
      - "tools/experiment_exp0002_immutable_page_recursive_delete.py"
      - "tools/experiment_exp0002_immutable_page_object-history.py"
      - "docs/experiments/0032-exp0002-immutable-page-object-history.md"
      - ".github/workflows/immutable-page-object-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise complete-object insert, delete, and verified history
        run: python3 tools/experiment_exp0002_immutable_page_object_history.py
