name: Patch Spill Page Emission

on:
  push:
    branches: ["phase-3/directory-snapshots-recovery"]
    paths:
      - ".github/workflows/patch-spill-page-emission.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/directory-snapshots-recovery
      - name: Fix ceil import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/experiment_exp0002_spill_page_emission.py")
          text = path.read_text(encoding="utf-8")
          anchor = "import math\nimport os\n"
          replacement = "import math\nimport os\nfrom math import ceil\n"
          if anchor not in text:
              raise SystemExit("import anchor not found")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Execute spill page emission
        run: python3 tools/experiment_exp0002_spill_page_emission.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/experiment_exp0002_spill_page_emission.py
          git diff --cached --check
          git commit -m "fix: complete spill-backed page emission experiment"
          git push origin HEAD:phase-3/directory-snapshots-recovery
